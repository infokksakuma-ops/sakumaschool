<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAKUMA SCHOOL 管理画面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --desk:#2b2540;
  --box-bg:#f8f6e4;
  --box-border:#2c4aa0;
  --box-border-inner:#7f9de8;
  --ink:#2a2a2a;
  --ink-soft:#5b5b6b;
  --green:#4caf6d;
  --yellow:#ffce00;
  --page-ink:#eee9f7;
}
*{box-sizing:border-box;}
body{
  margin:0; background:radial-gradient(ellipse 90% 60% at 50% -10%, #453a68 0%, transparent 60%), var(--desk);
  color:var(--page-ink); font-family:'Zen Maru Gothic', sans-serif; padding-bottom:60px;
}
.pixel{font-family:'DotGothic16', monospace; letter-spacing:0.5px;}
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:12px 16px; border-bottom:3px solid var(--box-border);
  background:rgba(23,20,31,0.92);
}
.back-link{
  font-size:11.5px; color:var(--page-ink); text-decoration:none;
  border:2px solid var(--box-border-inner); padding:6px 12px; border-radius:5px; background:#0e0c16;
}
.wrap{max-width:900px; margin:24px auto; padding:0 16px;}
h1{font-size:16px;}
table{
  width:100%; border-collapse:collapse; background:var(--box-bg); color:var(--ink);
  border:3px solid var(--box-border); border-radius:8px; overflow:hidden; font-size:12.5px;
}
th,td{padding:10px 12px; text-align:left; border-bottom:1px solid #d8d2b8;}
th{background:var(--box-border); color:#fff; font-size:11px;}
tr:last-child td{border-bottom:none;}
.bar-track{width:120px; height:8px; background:#e4dfc4; border-radius:5px; overflow:hidden; display:inline-block; vertical-align:middle; margin-right:6px;}
.bar-fill{height:100%; background:linear-gradient(90deg,var(--green),#2f8a51);}
.empty, .denied{color:var(--ink-soft); font-size:12px; text-align:center; padding:40px 0;}
</style>
</head>
<body>

<div class="topbar">
  <div class="pixel">SAKUMA SCHOOL｜管理画面</div>
  <a class="back-link pixel" href="index.html">← クエストログに戻る</a>
</div>

<div class="wrap">
  <h1 class="pixel">生徒の視聴進捗</h1>
  <div id="content">読み込み中...</div>
</div>

<script>
const SUPABASE_URL = 'https://gwvapbmijorqzavcssvd.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3dmFwYm1pam9ycXphdmNzc3ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MDUzNzQsImV4cCI6MjEwMjA4MTM3NH0.naWci7tc8OmEQ9WYCVZzFUB73tzWmZ-t8Oy4M2_hbzs';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const TOTAL_QUESTS = 35; // Chapter0〜5の合計本数(coming soon含む)

async function requireAuth(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ location.href = 'login.html'; return null; }
  return session.user;
}

async function boot(){
  const user = await requireAuth();
  if(!user) return;

  const content = document.getElementById('content');

  const { data: profiles, error: pErr } = await sb.from('profiles').select('id, email, created_at').order('created_at', {ascending:true});
  const { data: progressRows, error: prErr } = await sb.from('progress').select('user_id, data, updated_at');

  if(pErr || !profiles){
    content.innerHTML = '<div class="empty">読み込みエラー、または管理者権限がありません。</div>';
    return;
  }

  // 自分の行しか返ってこない(=管理者じゃない)場合はここで気づける
  if(profiles.length <= 1){
    content.innerHTML = '<div class="denied">この画面は管理者のみ閲覧できます。管理者として登録されていない可能性があります(Supabaseのadminsテーブルを確認してください)。</div>';
    return;
  }

  const progressMap = {};
  (progressRows||[]).forEach(r => { progressMap[r.user_id] = r.data || {}; });

  const rows = profiles.map(p=>{
    const data = progressMap[p.id] || {};
    const done = Object.values(data).filter(Boolean).length;
    const pct = Math.round(done/TOTAL_QUESTS*100);
    return {email:p.email, created_at:p.created_at, done, pct};
  });

  content.innerHTML = `
    <table>
      <tr><th>メール</th><th>登録日</th><th>進捗</th></tr>
      ${rows.map(r=>`
        <tr>
          <td>${r.email||'(不明)'}</td>
          <td>${new Date(r.created_at).toLocaleDateString('ja-JP')}</td>
          <td>
            <span class="bar-track"><span class="bar-fill" style="width:${r.pct}%"></span></span>
            ${r.done}/${TOTAL_QUESTS}（${r.pct}%）
          </td>
        </tr>`).join('')}
    </table>
  `;
}
boot();
</script>
</body>
</html>
