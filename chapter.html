<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAKUMA SCHOOL Chapter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#2b2540;
  --bezel:#17141f;
  --box-bg:#f8f6e4;
  --box-border:#2c4aa0;
  --box-border-inner:#7f9de8;
  --ink:#2a2a2a;
  --ink-soft:#5b5b6b;
  --red:#e6393f;
  --yellow:#ffce00;
  --green:#4caf6d;
  --blue:#3858a8;
  --purple:#8a5fd6;
  --page-ink:#eee9f7;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:radial-gradient(ellipse 90% 60% at 50% -10%, #453a68 0%, transparent 60%), var(--desk);
  color:var(--page-ink);
  font-family:'Zen Maru Gothic', sans-serif;
  line-height:1.7;
  padding-bottom:60px;
}
.pixel{font-family:'DotGothic16', monospace; letter-spacing:0.5px;}

.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:12px 16px; border-bottom:3px solid var(--box-border);
  background:rgba(23,20,31,0.92);
}
.topbar .name{font-size:12px; letter-spacing:1px;}
.back-link{
  font-size:11.5px; color:var(--page-ink); text-decoration:none;
  border:2px solid var(--box-border-inner); padding:6px 12px; border-radius:5px; background:#0e0c16;
}

.wrap{max-width:640px; margin:26px auto 0; padding:0 16px;}

.chapter-header{
  background:var(--box-bg); color:var(--ink); border:3px solid var(--box-border);
  box-shadow:0 0 0 2px var(--box-border-inner) inset; border-radius:8px;
  padding:16px 18px; margin-bottom:20px;
}
.chapter-header .num{color:var(--blue); font-size:11.5px;}
.chapter-header h1{font-size:18px; margin:4px 0 10px;}
.chapter-progress-track{height:10px; background:#0e0c16; border:2px solid var(--box-border); border-radius:6px; overflow:hidden;}
.chapter-progress-fill{height:100%; background:linear-gradient(90deg,var(--green),#2f8a51);}
.chapter-progress-num{font-size:10.5px; color:var(--ink-soft); margin-top:6px;}

.quest{
  background:var(--box-bg); border:3px solid var(--box-border); box-shadow:0 0 0 2px var(--box-border-inner) inset;
  border-radius:6px; padding:12px 14px; margin-bottom:10px; color:var(--ink);
  display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:12px;
}
@media (max-width:480px){.quest{grid-template-columns:auto 1fr;}
  .quest .quest-action{grid-column:1 / -1; justify-self:stretch;}}
.quest.done{box-shadow:0 0 0 2px var(--green) inset; border-color:var(--green);}
.quest.locked-quest{opacity:.55;}
.q-check{
  width:26px; height:26px; border-radius:50%; border:3px solid var(--ink);
  background:#fff; flex-shrink:0; position:relative;
}
.q-check::after{content:''; position:absolute; inset:6px; border-radius:50%; background:var(--ink);}
.quest.done .q-check{background:var(--red); border-color:#7a1216;}
.quest.done .q-check::after{background:#fff; inset:8px;}
.q-num{color:var(--blue); font-size:10.5px; margin-right:6px;}
.q-title{font-size:13.5px; font-weight:700;}
.quest-locked{font-size:11px; color:var(--ink-soft); padding:7px 10px; white-space:nowrap;}
.quest-action a{
  font-size:12px; padding:7px 12px; border-radius:5px; text-decoration:none;
  background:var(--blue); border:2px solid #1c3468; color:#fff; white-space:nowrap;
}
.quest.done .quest-action a{background:var(--green); border-color:#2f7d43;}

footer{text-align:center; color:#736d92; font-size:10.5px; margin-top:56px;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="topbar">
  <div class="name pixel">SAKUMA SCHOOL</div>
  <a class="back-link pixel" href="index.html">← クエストログに戻る</a>
</div>

<div class="wrap" id="content"></div>

<footer class="pixel">© 2024 K.K. SAKUMA</footer>

<script>
const CHAPTERS = {
  '0': {title:'講座の学び方'},
  '1': {title:'SNSビジネスについて'},
  '2': {title:'商品の作り方'},
  '3': {title:'営業の裏技'},
  '4': {title:'TikTokとは？'},
  '5': {title:'【丸パクリ推奨】実践編'},
};

const MAIN_QUESTS = [
  {id:'0',   title:'講座の学び方',                 available:true},
  {id:'1-1', title:'【認知・夢】or【お金】',         available:true},
  {id:'1-2', title:'SNSビジネス【お金】を産む',      available:true},
  {id:'1-3', title:'私は【認知・夢】を選択した',     available:true},
  {id:'2-1', title:'コンテンツジャンル選び',         available:true},
  {id:'2-2', title:'コンテンツ競合リサーチ',         available:true},
  {id:'2-3', title:'コンセプトの決め方',             available:true},
  {id:'2-4', title:'有料コンテンツのチャプター',     available:true},
  {id:'2-5', title:'コンテンツの作り方',             available:true},
  {id:'2-6', title:'教育サイトの作り方',             available:true},
  {id:'2-7', title:'サポート内容',                   available:true},
  {id:'2-8', title:'価格と決済',                     available:true},
  {id:'2-9', title:'LP作成手順',                     available:false},
  {id:'2-10',title:'公式LINEの作り方',               available:true},
  {id:'2-11',title:'商品購買の導線設計',             available:true},
  {id:'2-12',title:'無料プレゼント',                 available:true},
  {id:'3-1', title:'相談会の手順',                   available:true},
  {id:'3-2', title:'商品購買の導線設計',             available:true},
  {id:'3-3', title:'商品を買わない理由',             available:true},
  {id:'4-1', title:'アルゴリズムの考え方',           available:true},
  {id:'4-2', title:'競合リサーチ',                   available:true},
  {id:'4-3', title:'アカウント設計',                 available:true},
  {id:'4-4', title:'アカウントの機械学習',           available:true},
  {id:'4-5', title:'【認知・夢】or【お金】',         available:true},
  {id:'4-6', title:'優遇される映像',                 available:true},
  {id:'4-7', title:'優遇される台本',                 available:true},
  {id:'4-8', title:'コメント戦略',                   available:true},
  {id:'4-9', title:'誹謗中傷は必ず来る',             available:false},
  {id:'4-10',title:'海外戦略',                       available:false},
  {id:'4-11',title:'企業案件は事務所に入る',         available:false},
  {id:'4-12',title:'TikTok投稿手順_撮影',            available:true},
  {id:'4-13',title:'TikTok投稿手順_編集〜アップ',    available:true},
  {id:'4-14',title:'顔出しする？しない？',           available:true},
  {id:'5-1', title:'【認知・夢】のための動画',       available:true},
  {id:'5-2', title:'【お金】のための動画',           available:true},
];
MAIN_QUESTS.forEach(q=>{ q.chNum = q.id.split('-')[0]; });

const SUPABASE_URL = 'https://gwvapbmijorqzavcssvd.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3dmFwYm1pam9ycXphdmNzc3ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MDUzNzQsImV4cCI6MjEwMjA4MTM3NH0.naWci7tc8OmEQ9WYCVZzFUB73tzWmZ-t8Oy4M2_hbzs';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let state = {};
let currentUser = null;
let fullAccess = false;
const TRIAL_LIMIT_CHAPTER = 2;

function getSessionOnce(){
  return new Promise((resolve) => {
    let done = false;
    const { data: listener } = sb.auth.onAuthStateChange((_event, session) => {
      if(done) return;
      done = true;
      listener.subscription.unsubscribe();
      resolve(session);
    });
    // 保険: 数秒待ってもイベントが来なければ直接確認する
    setTimeout(async () => {
      if(done) return;
      const { data: { session } } = await sb.auth.getSession();
      if(done) return;
      done = true;
      listener.subscription.unsubscribe();
      resolve(session);
    }, 2000);
  });
}

async function requireAuth(){
  const session = await getSessionOnce();
  if(!session){ location.href = 'login.html'; return null; }
  return session.user;
}

async function loadAccess(){
  try{
    const { data } = await sb.from('profiles').select('full_access').eq('id', currentUser.id).maybeSingle();
    fullAccess = !!(data && data.full_access);
  }catch(e){ fullAccess = false; }
}

async function loadState(){
  try{
    const { data } = await sb.from('progress').select('data').eq('user_id', currentUser.id).maybeSingle();
    state = (data && data.data) ? data.data : {};
  }catch(e){ state = {}; }
}

function questCard(q){
  const done = !!state[q.id];
  const locked = q.available === false;
  const action = locked
    ? `<span class="quest-locked pixel">近日公開</span>`
    : `<a href="lesson.html?id=${encodeURIComponent(q.id)}">視聴する</a>`;
  return `<div class="quest ${done?'done':''} ${locked?'locked-quest':''}">
    <div class="q-check"></div>
    <div>
      <div class="q-title"><span class="q-num pixel">${q.id}</span>${q.title}</div>
    </div>
    <div class="quest-action">${action}</div>
  </div>`;
}

function render(){
  const params = new URLSearchParams(location.search);
  const ch = params.get('ch');
  const meta = CHAPTERS[ch];
  const content = document.getElementById('content');
  if(!meta){
    content.innerHTML = `<div class="chapter-header"><h1 class="pixel">Chapterが見つかりません</h1><a class="back-link pixel" href="index.html">← クエストログに戻る</a></div>`;
    return;
  }
  if(!fullAccess && parseInt(ch,10) > TRIAL_LIMIT_CHAPTER){
    content.innerHTML = `<div class="chapter-header"><div class="num pixel">CHAPTER ${ch}</div><h1>🔒 完全版限定コンテンツ</h1><p>この章はお試し版では視聴できません。完全版が解放されるとご覧いただけます。</p><a class="back-link pixel" href="index.html">← クエストログに戻る</a></div>`;
    return;
  }
  const quests = MAIN_QUESTS.filter(q=>q.chNum===ch);
  const done = quests.filter(q=>state[q.id]).length;
  const pct = quests.length ? Math.round(done/quests.length*100) : 0;

  content.innerHTML = `
    <div class="chapter-header">
      <div class="num pixel">CHAPTER ${ch}</div>
      <h1>${meta.title}</h1>
      <div class="chapter-progress-track"><div class="chapter-progress-fill" style="width:${pct}%"></div></div>
      <div class="chapter-progress-num pixel">${done}/${quests.length} クリア</div>
    </div>
    ${quests.map(q=>questCard(q)).join('')}
  `;
}

async function boot(){
  currentUser = await requireAuth();
  if(!currentUser) return;
  await loadAccess();
  await loadState();
  render();
}
boot();
</script>
</body>
</html>
